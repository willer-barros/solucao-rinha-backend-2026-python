services:
  nginx:
    image: nginx:alpine
    container_name: load_balancer
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - rinha-network
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 20M

  api1:
    build:
      context: .
      dockerfile: Dockerfile
    image: rinha-api-base:latest
    container_name: api1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    networks:
      - rinha-network
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: 165M

  api2:
    image: rinha-api-base:latest
    container_name: api2
    depends_on:
      - api1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    networks:
      - rinha-network
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: 165M

networks:
  rinha-network:
    driver: bridge